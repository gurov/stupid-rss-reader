<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- GitHub Pages cannot send headers, so the policy is here, before anything loads.
         connect-src is wide on purpose: a proxy of your own may be anywhere, also local.
         Scripts only from this site, no inline anything; Trusted Types policies:
         dompurify (sanitizing), srr-inert (DOMParser), srr-sw (the service worker). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types dompurify srr-inert srr-sw">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#41750b" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a2016" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A simple RSS and Atom reader. Your feeds and posts stay in your browser; it works offline and installs as an app.">
    <title>Stupid RSS Reader</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="assets/fur-boot-green.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="stylesheet" href="app.css">
    <script src="version.js"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>

<div id="banners" class="banners" aria-live="polite"></div>
<main id="app" class="app">

</body>
</html>
